# What a pull request has to survive.
#
# Two jobs, because the repository has two toolchains and neither can check the
# other. What is deliberately absent is explained at the bottom — a CI file that
# quietly omits a suite reads the same as one that never had it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # A hang here used to mean six hours of a runner doing nothing. Everything
    # in this job takes well under a minute.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is what package.json claims to support, so 22 is what gets tested;
        # an engines field nothing runs against is a guess. 24 is what the
        # maintainer develops on.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails when the lockfile and the manifest disagree.
      - run: npm ci

      # Builds all five workspaces, runs check:docs, then the unit tests.
      # check:docs reads ios/Rowel/Protocol/Frames.swift, ios/Rowel/Store/
      # Conversation.swift and relay-worker/src/wire.ts, so this job needs a
      # full checkout even though it never compiles either of them.
      - run: npm test

      # The end-to-end files that need nothing but this machine: the approval
      # and question round trip against the fake agent, the wait-for-a-phone
      # path, and waking a phone that is not running. The rest of e2e/ wants a
      # harness serving locally and would skip here, turning a hollow run green.
      #
      # ROWEL_E2E_DSH_URL points at a closed port on purpose. These three files
      # drive a FakeAgent and never dial a harness, but `startStack` still
      # insists on having a harness URL and will go looking for one when it is
      # not given a value. On a runner that scan is the slowest thing in the
      # job and, the first time this ran, it did not come back at all. Naming a
      # dead address skips it and changes nothing else.
      - name: end to end, the parts that stand alone
        env:
          ROWEL_E2E_DSH_URL: http://127.0.0.1:9
        run: >
          node --test --test-concurrency=1
          e2e/tests/approval.test.js
          e2e/tests/waiting.test.js
          e2e/tests/wake.test.js

  # A real dsh 0.2, because a fake can only agree with what we believed dsh
  # does. Rowel stopped working on every dsh from 0.1.2 on and this repository
  # did not notice for a month; this job is the reason it cannot happen again
  # (docs/dsh-0.2-migration.md D8). No model: each test starts a throwaway dsh
  # with an empty home and a bare environment, and a turn that needs a model
  # fails for want of credentials — which is how the prompt test knows its
  # request was well formed.
  dsh:
    name: dsh ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The version the protocol reference was checked against. Moved
        # forward only once the weekly run against @latest and @alpha
        # (dsh-drift.yml) is green and docs/dsh-0.2-protocol.md is updated.
        dsh: ['0.2.0-rc.2']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Outside the repository, so its dependencies cannot leak into ours.
      - run: npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@${{ matrix.dsh }}"

      - name: contract and end to end, against a real dsh
        env:
          ROWEL_E2E_DSH_BIN: ${{ runner.temp }}/dsh/node_modules/.bin/dsh
        run: >
          node --test --test-concurrency=1
          e2e/tests/contract.test.js
          e2e/tests/tunnel.test.js
          e2e/tests/direct.test.js
          e2e/tests/security.test.js
          e2e/tests/cli.test.js

  ios:
    name: ios
    # macOS minutes are free on public repositories, which is the only reason
    # this job is affordable at all.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Xcode project is generated from ios/project.yml and is not
      # committed, so this is a hard dependency, not a nicety.
      - run: brew install xcodegen

      # run-tests.sh picks the newest iPhone simulator that exists on the
      # machine rather than naming one, because that list differs between Xcode
      # versions and between a laptop and a runner. Set ROWEL_SIM to pin it.
      - run: npm run test:ios

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ios/build/Rowel.xcresult
          retention-days: 7

# Not here, and why:
#
#   relay-worker/tests/worker.test.js needs `wrangler dev` and a workerd
#   download, and relay-worker is not a workspace so it has no lockfile —
#   the job would be the least reproducible thing in the repository, guarding
#   eleven tests. The wire format it shares with protocol/src/mux.ts is already
#   compared by check:docs above, and the worker itself is exercised in its
#   deployed form by .github/workflows/deployed.yml.
#   (relay-worker/tests/bucket.test.js needs neither, and runs in npm test.)
#
#   The one test in e2e/tests/tunnel.test.js that runs a real model turn. It
#   needs provider credentials and spends them, so it runs only on a
#   developer's machine with ROWEL_E2E_MODEL=1, and skips (saying why) here.
#
#   ios/run-ui-tests.sh needs a booted simulator and a paired Bridle.
